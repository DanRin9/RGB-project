<div class="container mt-3">
  <h1>RGB</h1>

  <div class="row mb-3">
    <div class="col-12">
      <app-rgb-number (show)="onShow($event)" />
    </div>
  </div>

  <div class="row">
    <div class="col-4">
      @if (service.channelsResource.isLoading()) {
        <p>Cargando canales...</p>
      }
      @if (service.channelsResource.error()) {
        <p class="text-danger">Error al cargar los canales.</p>
      }
      @for (channel of service.channelsResource.value() ?? []; track channel.letter) {
        <app-separator [channel]="channel" [hex]="hex()" />
      }
    </div>
    <div class="col-8">
      <app-show-color [hex]="hex()" />
    </div>
  </div>
</div>
